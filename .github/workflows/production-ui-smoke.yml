name: Check BACK2U live PC and iPhone layout
on:
  push:
    branches: [cloudflare-migration]
    paths:
      - cloudflare/worker.js
      - site/index.html
      - site/workspace-v78.css
      - .github/workflows/production-ui-smoke.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify actual deployed layout through anonymous safe Boolean endpoint
        shell: bash
        run: |
          set -euo pipefail
          base="https://back2u-cloud.leon-mueller0806.workers.dev"
          # The dashboard and all CSS are protected by the login gate.
          # Anonymous direct GETs return the login page, not dashboard assets.
          # The Worker checks its bundled protected files server-side and
          # returns ONLY fixed allowlisted booleans; no HTML/body is printed.
          for attempt in $(seq 1 8); do
            if curl -fsSL --max-time 12 --retry 1 --retry-delay 1 \
                "$base/api/layout-verify" -o /tmp/back2u-layout-probe.json; then
              if node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const response=JSON.parse(readFileSync('/tmp/back2u-layout-probe.json','utf8'));
          const allowed=['html','css','bottomNavigation','desktopRail','mobileSafeArea','topVideoExpand'];
          for(const key of allowed)console.log('LAYOUT_'+key.toUpperCase()+'='+(response.checks?.[key]===true?'present':'missing'));
          if(response.release!=='V7.9'||response.ready!==true||
             !allowed.every(x=>response.checks?.[x]===true))process.exit(1);
          NODE
              then
                echo "BACK2U_LIVE_LAYOUT=VERIFIED"
                exit 0
              fi
            fi
            if [ "$attempt" -lt 8 ]; then sleep 8; fi
          done
          echo "BACK2U_LIVE_LAYOUT=NOT_YET_DEPLOYED_OR_INACCESSIBLE"
          echo "Protected HTML remains private. The Worker layout-verify endpoint did not confirm the deployed assets."
          exit 1
