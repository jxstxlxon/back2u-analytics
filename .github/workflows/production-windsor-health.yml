name: Check BACK2U production Windsor connection
on:
  push:
    branches: [cloudflare-migration]
    paths:
      - cloudflare/worker.js
      - .github/workflows/production-windsor-health.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect live public health (boolean only, never expose keys)
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            result=$(curl --max-time 12 -fsS 'https://back2u-cloud.leon-mueller0806.workers.dev/api/health' 2>/dev/null || true)
            if [ -n "$result" ]; then
              export HEALTH="$result"
              flag=$(node -e 'try{const h=JSON.parse(process.env.HEALTH);if(typeof h.windsorReady==="boolean"&&h.tiktokSync&&typeof h.tiktokSync.state==="string"&&h.extraSync&&h.extraSync.instagram&&h.extraSync.youtube)process.stdout.write(h.windsorReady?"ready":"missing");else process.stdout.write("not-deployed")}catch{process.stdout.write("invalid")}')
              if [ "$flag" = "ready" ]; then
                echo "WINDSOR_CONNECTION=CONFIGURED"
                node -e 'const h=JSON.parse(process.env.HEALTH);const allowed=["V7.9"];console.log("PRODUCTION_RELEASE="+(allowed.includes(h.release)?h.release:"NOT_DEPLOYED"))'
                node -e 'const h=JSON.parse(process.env.HEALTH);for(const k of ["snapshotStored","snapshotHasVideoCatalog","snapshotHasDailySeries"]){if(typeof h[k]==="boolean")console.log("PROD_"+k.toUpperCase()+"="+h[k])}'
                node -e 'const x=JSON.parse(process.env.HEALTH).tiktokSync;for(const k of ["state","reason","hasSavedDays","savedNewerThanSnapshot","originalHasDays","lastAttemptRecent","lastSuccessRecent"]){let v=x[k];if(typeof v==="boolean"||typeof v==="string")console.log("TIKTOK_"+k.toUpperCase()+"="+v)}'
                node -e 'const h=JSON.parse(process.env.HEALTH);for(const [name,x] of Object.entries(h.extraSync||{})){if(!x||typeof x!=="object")continue;for(const [k,v] of Object.entries(x)){if(typeof v==="boolean"||typeof v==="string")console.log("EXTRAS_"+name.toUpperCase()+"_"+k.toUpperCase()+"="+v)}}'
                node -e 'const s=JSON.parse(process.env.HEALTH).scheduler;if(!s){console.log("SCHEDULER=NOT_DEPLOYED");process.exit(0)}for(const [name,value] of Object.entries({CADENCE:s.cadence,PHASE:s.lastPhase,RECENT:s.recent})){if(typeof value==="string"||typeof value==="boolean")console.log("SCHEDULER_"+name+"="+value)}'
                node -e 'const x=JSON.parse(process.env.HEALTH).snapshotNotice;if(!x){console.log("SNAPSHOT_NOTICE=NOT_DEPLOYED");process.exit(0)}const types=["unknown","none","tiktok-bootstrap","tiktok-pagination","other","multiple"];console.log("SNAPSHOT_NOTICE="+(types.includes(x.category)?x.category:"unknown"));console.log("SNAPSHOT_LEGACY_TIKTOK_RECOVERED="+(x.legacyTikTokRecovered===true))'
                exit 0
              elif [ "$flag" = "missing" ]; then
                echo "WINDSOR_CONNECTION=MISSING_IN_PRODUCTION"
                exit 0
              fi
            fi
            sleep 12
          done
          echo "WINDSOR_CONNECTION=UNVERIFIED_ENDPOINT_UNREACHABLE_OR_VERSION_MISSING"
          exit 1
