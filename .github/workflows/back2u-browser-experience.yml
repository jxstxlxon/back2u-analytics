name: BACK2U iPhone iPad Desktop Browser Experience
on:
  pull_request:
    paths:
      - site/**
      - cloudflare/**
      - tests/**
      - package.json
      - .github/workflows/back2u-browser-experience.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  playwright-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium browser
        run: |
          npm install --no-save --ignore-scripts playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test full responsive UI interactions without private APIs
        run: node tests/v801-browser-smoke.mjs
      - name: Save non-sensitive offline theme screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: back2u-v809-theme-previews
          path: artifacts/v809/*.png
          retention-days: 2
          if-no-files-found: ignore
